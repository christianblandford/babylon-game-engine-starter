<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Babylon Game Scaffold</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; overscroll-behavior: none; }
      #renderCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #0b0d12; color: #9aa4b2; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.08em;
        transition: opacity 0.4s ease; z-index: 10;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #stats {
        position: fixed; top: 8px; left: 10px; z-index: 5; pointer-events: none;
        font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #b6f5b0;
        background: rgba(0, 0, 0, 0.5); padding: 5px 7px; border-radius: 4px; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="loading">LOADING…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
